[project]
name = "meccog"
version = "0.1.0"
description = "Find papers and extract grounded, audited experimental findings for MecCog mechanism hypotheses"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joel Chan" }]
dependencies = ["anthropic>=2.6", "pymupdf>=1.24", "openpyxl>=3.1", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
meccog = "meccog.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
